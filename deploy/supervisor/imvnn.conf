; Supervisor programs for the IMV NN pipeline.
;
; Install:   sudo install -o root -g root -m 0644 deploy/supervisor/imvnn.conf /etc/supervisord.d/imvnn.ini
;            sudo supervisorctl reread && sudo supervisorctl update
;
; Replace /var/www/imvnn if the application lives elsewhere. The `imvnn`
; Linux user must exist and own the project, its storage directories, and
; /var/log/imvnn. Do not run these long-lived workers as root.
;
; Required .env setting for the 900-second video job:
; DB_QUEUE_RETRY_AFTER=960
;
; Queue topology source of truth: App\Enums\QueueName::workerPools().
; `php artisan queue:health --stuck-after=60` verifies that no configured
; queue is accumulating ready, unreserved jobs.
;
; This file owns schedule:work. Do not additionally install a cron entry for
; `php artisan schedule:run`, or scheduled source fetches will fire twice.

[program:imvnn-pipeline]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/imvnn/artisan queue:work --queue=news-fetch,news-parse,media-extraction,media-download,media-processing,image-analysis,media-optimization,media-selection --tries=3 --max-time=3600
directory=/var/www/imvnn

autostart=true
autorestart=true
startsecs=5

user=imvnn
numprocs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=120

redirect_stderr=true
stdout_logfile=/var/log/imvnn/pipeline.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:imvnn-video]
process_name=%(program_name)s
command=/usr/bin/php /var/www/imvnn/artisan queue:work --queue=video-processing --tries=2 --timeout=900 --max-time=3600
directory=/var/www/imvnn

autostart=true
autorestart=true
startsecs=5

user=imvnn
stopasgroup=true
killasgroup=true
stopwaitsecs=960

redirect_stderr=true
stdout_logfile=/var/log/imvnn/video.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:imvnn-telegram]
process_name=%(program_name)s
command=/usr/bin/php /var/www/imvnn/artisan queue:work --queue=telegram-publishing --tries=4 --max-time=3600
directory=/var/www/imvnn

autostart=true
autorestart=true
startsecs=5

user=imvnn
stopasgroup=true
killasgroup=true
stopwaitsecs=120

redirect_stderr=true
stdout_logfile=/var/log/imvnn/telegram.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:imvnn-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /var/www/imvnn/artisan schedule:work
directory=/var/www/imvnn

autostart=true
autorestart=true
startsecs=5

user=imvnn
stopasgroup=true
killasgroup=true
stopwaitsecs=120

redirect_stderr=true
stdout_logfile=/var/log/imvnn/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[group:imvnn]
programs=imvnn-pipeline,imvnn-video,imvnn-telegram,imvnn-scheduler
