; Supervisor programs for the IMV NN pipeline.
;
; Install:   cp deploy/supervisor/imvnn.conf /etc/supervisord.d/imvnn.ini
;            (AlmaLinux reads /etc/supervisord.d/*.ini)
;            supervisorctl reread && supervisorctl update
;
; Replace %(ENV_HOME)s-style placeholders below: set `directory` and `user`
; to match the deploy. Everything else is tuned for this pipeline.
;
; stopwaitsecs is the setting that matters most here. Supervisor SIGKILLs a
; worker that hasn't exited within it, and a job killed mid-flight is left
; reserved — Laravel re-runs it after retry_after, which for the publishing
; scheduler means the interrupted run reschedules a *second* chain alongside
; the one it already dispatched. That is how three concurrent chains once
; tripled the posting rate. Each value below therefore exceeds the longest
; job that queue can run.

[program:imvnn-pipeline]
; news fetching/parsing plus the whole media pipeline through selection.
; Longest job here: DownloadMediaJob at 60s.
command=php /var/www/imvnn/artisan queue:work --queue=news-fetch,news-parse,media-extraction,media-download,image-analysis,media-optimization,media-selection --tries=3 --max-time=3600
directory=/var/www/imvnn
user=imvnn
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/imvnn/pipeline.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:imvnn-video]
; Isolated on purpose: ffmpeg is CPU/memory heavy and can run for minutes,
; and must never share a pool with the fast queues above.
; ProcessVideoJob timeout is 900s, so stopwaitsecs must exceed it.
command=php /var/www/imvnn/artisan queue:work --queue=video-processing --tries=2 --timeout=900 --max-time=3600
directory=/var/www/imvnn
user=imvnn
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/log/imvnn/video.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:imvnn-telegram]
; Kept separate so a post never queues behind a transcode.
command=php /var/www/imvnn/artisan queue:work --queue=telegram-publishing --tries=4 --max-time=3600
directory=/var/www/imvnn
user=imvnn
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/imvnn/telegram.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[group:imvnn]
programs=imvnn-pipeline,imvnn-video,imvnn-telegram
